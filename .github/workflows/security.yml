name: Security gates

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_call:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cpanel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned security tools
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          go install github.com/gitleaks/gitleaks/v8@v8.30.1
      - name: Scan Git history for credentials
        run: |
          gitleaks git --redact --config .gitleaks.toml
          gitleaks dir . --redact --config .gitleaks.toml
      - name: Vet and test
        env:
          CPANEL_TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cpanel_test?sslmode=disable
        run: |
          go vet ./...
          go mod verify
          go test -race ./...
      - name: Verify signed installers
        run: |
          bash -n install.sh
          sh -n web/public/corade-install.sh
          sh .github/tests/installer-signature-test.sh install.sh
          sh .github/tests/installer-signature-test.sh web/public/corade-install.sh
      - name: Scan production Go paths for both release architectures
        env:
          GOOS: linux
          CGO_ENABLED: "0"
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" govulncheck ./...
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: web/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Audit and test frontend
        working-directory: web
        run: |
          npm ci
          npm audit --audit-level=moderate
          npm run typecheck
          npm test
          npm run build
