name: Build latest release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-release
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            goarch: amd64
          - arch: arm64
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Validate installers
        run: bash -n install.sh web/public/corade-install.sh
      - name: Build administrator UI
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Test
        if: matrix.arch == 'amd64'
        run: go test ./...
      - name: Build Linux binary
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w" -o "dist/cpanel-linux-${{ matrix.arch }}" ./cmd/cpanel
          cd dist
          sha256sum "cpanel-linux-${{ matrix.arch }}" > "cpanel-linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: cpanel-linux-*
          path: dist
          merge-multiple: true
      - name: Publish rolling latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push origin refs/tags/latest --force
          if gh release view latest >/dev/null 2>&1; then
            gh release edit latest --title "Latest CPanel build" --prerelease --notes "Automatically built from main at ${GITHUB_SHA}."
            gh release upload latest dist/* --clobber
          else
            gh release create latest dist/* --title "Latest CPanel build" --prerelease --notes "Automatically built from main at ${GITHUB_SHA}."
          fi
